services:
  app:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://workbench:${POSTGRES_PASSWORD}@personal-workbench-db:5432/workbench
      AUTH_SECRET: ${AUTH_SECRET}
      INVENTORY_ENCRYPTION_KEY: ${INVENTORY_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8790}:3000"
    networks: [internal]
  migrate:
    build:
      context: .
      target: build
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      DATABASE_URL: postgres://workbench:${POSTGRES_PASSWORD}@personal-workbench-db:5432/workbench
    command: ["pnpm", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [workbench_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      internal:
        aliases:
          - personal-workbench-db
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - workbench_backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh","-c","while true; do sh /backup.sh; sleep 86400; done"]
    depends_on: [db]
    networks: [internal]
networks:
  internal:
volumes:
  workbench_db:
  workbench_backups:
